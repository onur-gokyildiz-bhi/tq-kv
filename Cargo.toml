[workspace]
members = ["tq-kv"]

[package]
name = "tq-engine"
version = "0.7.0"
edition = "2021"
description = "TurboQuant-powered LLM inference engine — Pure Rust, custom CUDA backend"
keywords = ["llm", "inference", "turboquant", "kv-cache", "quantization"]

[features]
default = []
cuda = ["cudarc", "half"]
# Skeleton GQA shared-K kernel launcher. Off by default; the kernel itself
# always compiles into the PTX (it's pure additive in fused_attention.cu),
# but the Rust-side launch path is only built when this feature is on.
# See docs/gqa-shared-k-design.md.
gqa-shared-k = ["cuda"]
# Asymmetric K/V bit precision passthrough — forwards to tq-kv. With this
# feature on, `TurboQuantConfig::effective_k_bits()` / `effective_v_bits()`
# honor the `k_bits` / `v_bits` overrides; otherwise they fall back to
# `bits` / `value_bits` (symmetric back-compat). See
# docs/asymmetric-kv-design.md (internal) and the Hadamard Q1-Q4 knowledge
# entry (`unblocks:hadamard-open-q`).
asymmetric-kv = ["tq-kv/asymmetric-kv"]
# Persistent kernel lite (Plan #6). Phase 1 skeleton: megakernel shell with
# counter-based phase sync. The CUDA kernel itself
# (`persistent_decode_layer_f32` in kernels/persistent_decode.cu) always
# compiles into the PTX, but the Rust-side launcher is only built when
# this feature is enabled. Runtime gate: TQ_PERSISTENT=1.
# See docs/persistent-kernel-lite-design.md.
persistent-kernel = ["cuda"]
# Sparse-V attention gating (Hadamard, Phase 1: uncompressed V). The CUDA
# kernel `gqa_decode_attention_sparse_v_f32` in kernels/fused_attention.cu
# is pure-additive and always compiles into the PTX; this feature only
# gates the Rust-side launcher. Not wired into dispatch yet — follow-up
# session owns forward_attn wiring + NIAH validation.
# See docs/sparse-v-design.md.
sparse-v = ["cuda"]
# Tensor-core flash attention (Sprint G / Volta). Phase 1 skeleton: the
# kernel `flash_decode_mma_f16_f32` in kernels/flash_decode_mma.cu always
# compiles into the PTX (pure additive, no mma.sync yet — that is Phase 2).
# This feature only gates the Rust-side launcher. Not wired into dispatch.
# Future runtime gate: TQ_ATTN=mma.
# See docs/tensor-core-flash-attn-plan.md.
tensor-core-attn = ["cuda"]

[dependencies]
tq-kv = { path = "tq-kv" }
cudarc = { version = "0.19", features = ["driver", "cublas", "nvrtc", "cuda-version-from-build-system", "f16"], optional = true }
half = { version = "2", optional = true }
tokenizers = "0.20"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.4"
anyhow = "1"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
rayon = "1.10"
matrixmultiply = "0.3"
uuid = { version = "1", features = ["v4"] }
safetensors = "0.4"
memmap2 = "0.9"

[[bin]]
name = "tq"
path = "src/main.rs"

[[bin]]
name = "tq-diagnose"
path = "src/diagnose.rs"

[profile.release]
opt-level = 3
lto = true
